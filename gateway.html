<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcp-gateway</title>
<style>
/* example/agent-sim(static/style.css)의 색·카드·버튼 규칙을 그대로 가져왔다. */
:root { --blue:#1428a0; --blue-dark:#0e1c70; --ink:#202c40; --muted:#5b6a80;
  --line:#e0e6ef; --bg:#f5f7fb; --card:#fff; --warn:#b3261e; --soft:#f0f3fa; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
button,input { font:inherit; }
button { border:1px solid var(--line); padding:8px 13px; min-height:38px;
  border-radius:7px; background:#fff; color:var(--ink); cursor:pointer; font-weight:600; }
button:hover { background:var(--soft); }
button:focus-visible,a:focus-visible { outline:3px solid #87a8fa; outline-offset:3px; }
a { color:var(--blue); }
.top { background:var(--blue); color:#fff; }
.top-inner { display:flex; align-items:center; gap:22px; max-width:1000px; padding:12px 24px; margin:auto; }
.brand { font-size:19px; font-weight:750; letter-spacing:-.4px; white-space:nowrap; flex:1; }
.brand span { display:block; font-size:10px; font-weight:400; color:#c8d2fb; letter-spacing:0; }
.chips { display:flex; gap:12px; }
.chip { color:#e0e7ff; font-size:11px; white-space:nowrap; }
.chip a { color:inherit; }
.panel { max-width:960px; margin:auto; padding:25px 24px 64px; }
.page-heading { margin-bottom:22px; }
.eyebrow { font-size:10px; letter-spacing:1.5px; color:var(--blue); font-weight:750; }
h1 { font-size:24px; line-height:1.4; letter-spacing:-.7px; margin:4px 0 6px; }
.page-heading p { margin:0; color:var(--muted); font-size:13px; }
.page-heading code,.hint code { font:12px/1.6 Consolas,monospace; color:#3d4a63; }
.card { padding:20px; margin-bottom:14px; background:var(--card); border:1px solid var(--line); border-radius:12px; min-width:0; }
.card h2,dialog h2 { font-size:16px; line-height:1.5; margin:0; letter-spacing:-.3px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.hint { font-size:12px; color:var(--muted); margin:4px 0 13px; line-height:1.7; }
.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
.primary:hover { background:var(--blue-dark); }
.ghost { font-size:12px; color:var(--muted); background:#fff; padding:6px 10px; min-height:32px; font-weight:500; }
.ghost:hover { color:var(--warn); border-color:#e6c3bf; background:#fff0ee; }
.count,.connection-status { display:inline-block; padding:2px 8px; border-radius:5px;
  background:#eef2f8; color:#556880; font-size:11px; font-weight:500; }
.connection-status.connected { color:#236d58; background:#eaf6f0; }
.connection-status.failed { color:var(--warn); background:#fff0ee; }
.empty { padding:18px 12px; color:var(--muted); font-size:13px; border-radius:7px; background:#f6f8fc; text-align:center; }
.server { display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--line); }
.server:last-child { padding-bottom:0; }
.server .body { flex:1; min-width:0; }
.server .body b { font:600 13px/1.6 Consolas,monospace; color:var(--blue); overflow-wrap:anywhere; margin-right:8px; }
.server .body > span { display:block; font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
.server .body > .url { font:11px/1.6 Consolas,"Malgun Gothic",monospace; color:#52637b; }
.server > button { flex-shrink:0; }
dialog { width:min(560px,calc(100vw - 32px)); padding:20px; border:1px solid var(--line); border-radius:12px; color:var(--ink); }
dialog::backdrop { background:#0e1c7066; }
form { display:grid; gap:12px; }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
input { display:block; width:100%; min-width:0; border:1px solid #ccd6e5; border-radius:7px; padding:10px 12px;
  color:var(--ink); background:#fff; font-size:14px; line-height:1.65; }
input:focus { outline:2px solid #7e98e1; outline-offset:1px; border-color:var(--blue); }
input::placeholder { color:#8591a2; }
.buttons { display:flex; gap:8px; justify-content:flex-end; }
#status { margin:0; color:var(--warn); font-size:13px; overflow-wrap:anywhere; }
#status:empty { display:none; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">mcp-gateway<span>API를 MCP 도구로 제공하는 게이트웨이</span></div>
    <div class="chips"><span class="chip"><a href="/docs">Swagger</a></span><span class="chip"><a href="http://127.0.0.1:8002/" target="_blank" rel="noopener">에이전트</a></span></div>
  </div>
</header>

<main class="panel">
  <div class="page-heading"><span class="eyebrow">MCP GATEWAY</span><h1>API를 도구로 등록하기</h1><p>등록한 CSV API는 데이터셋 도구가 됩니다. 호출하면 인메모리 DB에 적재되고, 에이전트는 요약·질의·차트 도구로 분석합니다. MCP 접속 주소: <code id="endpoint"></code></p></div>

  <section class="card">
    <div class="card-head"><h2>등록된 API <span class="count" id="count">–</span></h2><button class="primary" id="open" type="button">등록</button></div>
    <p class="hint">상태는 원본 API가 응답하는지 확인한 결과입니다. 도구를 직접 실행해 보려면 <a href="/docs">Swagger</a>를 쓰세요.</p>
    <div id="rows"></div>
  </section>
</main>

<dialog id="dialog" aria-labelledby="dialog-title">
  <form id="form">
    <h2 id="dialog-title">API 등록</h2>
    <div><label for="name">이름 — 영문·숫자·_·- (도구 이름이자 테이블 이름. 같은 이름이면 덮어씁니다)</label><input id="name" required pattern="[A-Za-z0-9_\-]{1,64}" placeholder="secom"></div>
    <div><label for="description">설명 — 모델이 도구를 고를 때 읽습니다</label><input id="description" placeholder="SECOM 센서 데이터 (CSV)"></div>
    <div><label for="url">URL — CSV를 돌려주는 GET 주소</label><input id="url" type="url" required placeholder="http://127.0.0.1:8000/secom"></div>
    <p id="status" role="alert"></p>
    <div class="buttons">
      <button id="cancel" type="button">취소</button>
      <button class="primary" type="submit">등록</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
$("endpoint").textContent = location.origin + "/mcp";

// 등록 값은 사용자 입력이다. 항상 textContent로만 넣는다.
function make(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

// FastAPI 오류 본문: {"detail": "문장"} 또는 {"detail": [{"loc": [...], "msg": "..."}]}
async function errorText(res) {
  try {
    const detail = (await res.json()).detail;
    if (typeof detail === "string") return detail;
    return detail.map((d) => d.loc[d.loc.length - 1] + ": " + d.msg).join(" / ");
  } catch (err) {
    return "요청에 실패했습니다 (HTTP " + res.status + ").";
  }
}

// 게이트웨이를 거쳐 원본 API의 첫 줄만 받아 본다. 성공하면 살아 있는 것이다.
async function check(name, badge) {
  let alive = false;
  try {
    alive = (await fetch("/apis/" + encodeURIComponent(name) + "/test?limit=1")).ok;
  } catch (err) { /* 게이트웨이 자체가 응답하지 않음 */ }
  badge.textContent = alive ? "정상" : "응답 없음";
  badge.className = "connection-status " + (alive ? "connected" : "failed");
}

async function load() {
  const apis = await (await fetch("/apis")).json();
  const rows = $("rows");
  rows.replaceChildren();
  $("count").textContent = apis.length + "개";
  if (!apis.length) rows.append(make("div", "등록된 API가 없습니다. [등록]을 눌러 추가하세요.", "empty"));
  for (const api of apis) {
    const state = make("span", "확인 중…", "connection-status");
    check(api.name, state);

    const body = make("div", undefined, "body");
    const title = make("div");
    title.append(make("b", api.name), state);
    body.append(title, make("span", api.url, "url"));
    if (api.description) body.append(make("span", api.description));

    const remove = make("button", "삭제", "ghost");
    remove.type = "button";
    remove.setAttribute("aria-label", api.name + " 삭제");
    remove.addEventListener("click", async () => {
      if (!confirm(api.name + " 을(를) 삭제할까요?")) return;
      await fetch("/apis/" + encodeURIComponent(api.name), { method: "DELETE" });
      load();
    });

    const row = make("div", undefined, "server");
    row.append(body, remove);
    rows.append(row);
  }
}

$("open").addEventListener("click", () => {
  $("form").reset();
  $("status").textContent = "";
  $("dialog").showModal();
});
$("cancel").addEventListener("click", () => $("dialog").close());

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const body = { name: $("name").value.trim(), description: $("description").value.trim(), url: $("url").value.trim() };
  const res = await fetch("/apis", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    $("status").textContent = await errorText(res);
    return;
  }
  $("dialog").close();
  load();
});

load();
</script>
</body>
</html>
