<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노드 데이터 — mcp-gateway</title>
<style>
/* 파이프라인 노드의 공유 링크(/view/<노드 id>)가 여는 테이블 뷰어. 색·카드 규칙은 gateway.html과 같다. */
:root { --blue:#1428a0; --ink:#202c40; --muted:#5b6a80; --line:#e0e6ef; --bg:#f5f7fb; --warn:#b3261e; --soft:#f0f3fa; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
a { color:var(--blue); }
a:focus-visible,summary:focus-visible,.data-wrap:focus-visible { outline:3px solid #87a8fa; outline-offset:3px; }
.top { background:var(--blue); color:#fff; }
.top-inner { display:flex; align-items:center; gap:22px; padding:12px 24px; }
.brand { font-size:19px; font-weight:750; letter-spacing:-.4px; flex:1; }
.brand span { display:block; font-size:10px; font-weight:400; color:#c8d2fb; }
.chip a { color:#e0e7ff; font-size:11px; }
.panel { padding:22px 24px 48px; }
.eyebrow { font-size:10px; letter-spacing:1.5px; color:var(--blue); font-weight:750; }
h1 { font:750 22px/1.4 Consolas,monospace; margin:4px 0 6px; overflow-wrap:anywhere; }
.meta { margin:0 0 4px; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
.meta:empty { display:none; }
#status.failed { color:var(--warn); }
.card { padding:16px 20px; margin:14px 0; background:#fff; border:1px solid var(--line); border-radius:12px; }
summary { cursor:pointer; font-weight:600; font-size:13px; }
pre { margin:10px 0 0; padding:12px; border-radius:6px; background:#1f2430; color:#e6e9f0;
  font:12px/1.6 Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
.data-wrap { max-height:calc(100vh - 250px); min-height:200px; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:12px; }
.data-wrap:empty { display:none; }
table { border-collapse:collapse; font:12px/1.6 Consolas,"Malgun Gothic",monospace; }
th,td { padding:4px 10px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); text-align:left;
  white-space:nowrap; max-width:280px; overflow:hidden; text-overflow:ellipsis; }
th { position:sticky; top:0; background:var(--soft); color:var(--muted); font-weight:600; }
th span { display:block; font-weight:400; font-size:10px; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">mcp-gateway<span>파이프라인 노드 데이터</span></div>
    <span class="chip"><a href="/">등록 화면</a></span>
    <span class="chip"><a href="http://127.0.0.1:8002/" target="_blank" rel="noopener">에이전트</a></span>
  </div>
</header>

<main class="panel">
  <span class="eyebrow">PIPELINE NODE</span>
  <h1 id="name"></h1>
  <p class="meta" id="meta"></p>
  <p class="meta">이 페이지의 주소를 에이전트 대화창에 붙이고 지시하면, 이 노드의 데이터를 기준으로 시각화합니다.</p>
  <p class="meta" id="status" role="status">데이터를 불러오는 중…</p>
  <details class="card" id="sqlCard" hidden><summary>이 노드의 SQL</summary><pre id="sql"></pre></details>
  <div id="data" class="data-wrap" tabindex="0" role="region" aria-label="노드 데이터"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const KIND = { source: "데이터셋", sql: "SQL 노드" };

// 노드 데이터는 외부에서 온 값이다. 항상 textContent로만 넣는다.
function make(tag, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
}

function fail(text) {
  $("status").textContent = text;
  $("status").className = "meta failed";
}

async function load() {
  const id = decodeURIComponent(location.pathname.split("/").pop());
  $("name").textContent = id;
  document.title = id + " — mcp-gateway";
  const node = (await (await fetch("/pipeline")).json()).find((n) => n.id === id);
  if (!node || node.kind === "output") {
    fail("이 노드는 지금 파이프라인에 없습니다. 게이트웨이를 다시 시작했거나 노드가 지워졌습니다.");
    return;
  }
  $("meta").textContent = KIND[node.kind] + (node.title ? " · " + node.title : "")
    + (node.inputs.length ? " · 입력: " + node.inputs.join(", ") : "")
    + (node.rows === undefined ? "" : " · " + node.rows.toLocaleString() + "행") + " · " + node.columns.length + "열";
  if (node.sql) {
    $("sql").textContent = node.sql;
    $("sqlCard").hidden = false;
  }
  const res = await fetch("/pipeline/" + encodeURIComponent(id) + "/rows?limit=200");
  const data = await res.json();
  if (!res.ok) {
    fail("데이터를 불러오지 못했습니다: " + data.detail);
    return;
  }
  $("status").textContent = "앞 " + data.rows.length + "행" + (data.more_rows ? " (더 있음)" : " (전체)")
    + (data.total_columns > data.columns.length ? " · 컬럼 " + data.total_columns + "개 중 앞 " + data.columns.length + "개" : "");
  const types = new Map(node.columns);
  const head = make("tr");
  for (const name of data.columns) {
    const th = make("th", name);
    th.scope = "col";
    th.append(make("span", types.get(name) || ""));
    head.append(th);
  }
  const thead = make("thead"), body = make("tbody");
  thead.append(head);
  for (const row of data.rows) {
    const tr = make("tr");
    for (const value of row) tr.append(make("td", value));
    body.append(tr);
  }
  const table = make("table");
  table.append(thead, body);
  $("data").replaceChildren(table);
}

load().catch(() => fail("게이트웨이에 연결하지 못했습니다."));
</script>
</body>
</html>
